[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-digest"
version = "0.1.0"
description = "Multi-project news collection, editorial processing and Telegram publishing worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "python-telegram-bot>=21,<23",
  "aiosqlite>=0.20,<1",
  "python-dateutil>=2.9,<3",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
news-digest = "news_digest.cli:main"

[tool.setuptools.packages.find]
include = ["news_digest*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
